name: Windows beta release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: refs/tags/${{ github.event.release.tag_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Require the tag to match the application version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = python -c "from scripts.package import version; print(version())"
          if ($LASTEXITCODE -ne 0 -or $env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match main.py VERSION.' }
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare and verify public upstream originals
        run: python scripts/prepare_resources.py
      - name: Run synthetic regression tests (no vehicle)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build Windows x64 executable
        run: python scripts/build.py
      - name: Verify frozen UTF-8 logging, resources and demo screens
        shell: python
        run: |
          import json, os, pathlib, subprocess, tempfile
          root = pathlib.Path.cwd()
          exe = root / 'dist/MGU-Assistant/MGU-Assistant.exe'
          with tempfile.TemporaryDirectory() as state:
              common = ['--resource-dir', str(root / 'resources'), '--state-dir', state]
              environment = dict(os.environ, PYTHONIOENCODING='cp1252')
              result = subprocess.run([str(exe), '--self-test', *common], capture_output=True, timeout=90, env=environment)
              assert result.returncode == 0, result.stderr.decode('utf-8', errors='replace')
              data = json.loads(result.stdout.decode('utf-8'))
              assert data['logging'] == 'UTF-8: à → • ✓', data
              result = subprocess.run([str(exe), '--ui-smoke', *common], capture_output=True, timeout=90)
              assert result.returncode == 0, result.stderr.decode('utf-8', errors='replace')
      - name: Package portable executable, sources, licenses and SHA-256
        run: python scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64
          path: release
      - name: Attach unsigned Windows package and checksums to the published prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd release
          sha256sum --check ./*.sha256
          gh release upload "$RELEASE_TAG" ./*.zip ./*.sha256
